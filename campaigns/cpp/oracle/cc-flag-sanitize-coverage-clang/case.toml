summary = "Argv-only sanitizer coverage instrumentation restores exact objects; changing instrumentation flags cannot hit the old entry"
cohort = "blocking"
families = ["clang"]
profiles = ["transparent", "reproducible"]
requires = [["{cc}", "-fsanitize-coverage=trace-pc-guard", "-x", "c", "-c", "-", "-o", "probe.o"]]
requires_stdin = "int u(int x) { return x > 3; }\n"
outputs = ["guard.o","counters.o","table.o","fuzzer.o"]

[[compile]]
argv = ["{cc}", "@guard.rsp", "-c", "u.c", "-o", "guard.o"]
source = "u.c"
also_names = ["@guard.rsp"]

[[compile]]
argv = ["{cc}", "@counters.rsp", "-c", "u.c", "-o", "counters.o"]
source = "u.c"
also_names = ["@counters.rsp"]

[[compile]]
argv = ["{cc}", "@table.rsp", "-c", "u.c", "-o", "table.o"]
source = "u.c"
also_names = ["@table.rsp"]

[[compile]]
argv = ["{cc}", "@fuzzer.rsp", "-c", "u.c", "-o", "fuzzer.o"]
source = "u.c"
also_names = ["@fuzzer.rsp"]

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "instrumentation-change"
reuse = "miss"
action = [
  { op = "delete-outputs" },
  { op = "write", path = "guard.rsp", content = "-fsanitize-coverage=trace-pc-guard,trace-cmp\n" },
  { op = "write", path = "counters.rsp", content = "-fsanitize-coverage=inline-8bit-counters,trace-cmp\n" },
  { op = "write", path = "table.rsp", content = "-fsanitize-coverage=inline-8bit-counters,pc-table,trace-cmp\n" },
  { op = "write", path = "fuzzer.rsp", content = "-fsanitize=fuzzer-no-link -fsanitize-coverage=trace-pc-guard,trace-cmp\n" }
]

[[step]]
name = "restore-variant"
reuse = "hit"
action = [{ op = "delete-outputs" }]
