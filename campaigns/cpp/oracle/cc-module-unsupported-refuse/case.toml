summary = "C++20 module interface production (clang++ --precompile) passes through: every run produces the raw .pcm and nothing is cached"
cohort = "blocking"
families = ["clang"]
requires = [["{cxx}", "-std=c++20", "-x", "c++-module", "--precompile", "-", "-o", "probe.pcm"]]
requires_stdin = "export module m;\nexport int answer() { return 42; }\n"
profiles = ["transparent", "reproducible"]
outputs = ["m.pcm"]

[[compile]]
argv = ["{cxx}", "-std=c++20", "-x", "c++-module", "--precompile", "m.cppm", "-o", "m.pcm"]
source = "m.cppm"
reuse = "any"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "again"
reuse = "miss"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit-interface"
reuse = "miss"
action = [{ op = "write", path = "m.cppm", content = "export module m;\nexport int answer() { return 43; }\n" }, { op = "delete-outputs" }]
