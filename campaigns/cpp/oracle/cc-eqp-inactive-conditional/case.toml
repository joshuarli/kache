summary = "editing text inside #if 0 keeps the expansion; kache reuses like ccache, and flipping the condition misses"
cohort = "open"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit-inactive"
reuse = "like-ccache"
action = [{ op = "write", path = "h.h", content = "#if 0\n#define H 7\n#else\n#define H 3\n#endif\n" }, { op = "delete-outputs" }]

[[step]]
name = "again"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "activate"
reuse = "miss"
action = [{ op = "write", path = "h.h", content = "#if 1\n#define H 7\n#else\n#define H 3\n#endif\n" }, { op = "delete-outputs" }]
