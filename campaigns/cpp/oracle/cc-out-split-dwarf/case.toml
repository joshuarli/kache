summary = "-gsplit-dwarf writes a .dwo beside the object; a hit restores both, an object naming another .dwo is never reused, and without -g the .dwo is restored exactly when the compiler writes one (CCP-05)"
cohort = "blocking"
os = ["linux"]
profiles = ["transparent", "reproducible"]
outputs = ["c/u.o", "c/u.dwo", "a/u.o", "a/u.dwo", "b/u.o", "b/u.dwo"]

[[compile]]
argv = ["{cc}", "-gsplit-dwarf", "-c", "u.c", "-o", "c/u.o"]
source = "u.c"

[[compile]]
argv = ["{cc}", "-g", "-gsplit-dwarf", "-c", "u.c", "-o", "a/u.o"]
source = "u.c"

[[compile]]
argv = ["{cc}", "-g", "-gsplit-dwarf", "-c", "u.c", "-o", "b/u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit"
reuse = "miss"
action = [{ op = "write", path = "u.c", content = "int u(int x) { return x * 9; }\n" }, { op = "delete-outputs" }]
