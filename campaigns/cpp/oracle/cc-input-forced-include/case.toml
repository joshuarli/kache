summary = "-include file content is part of the key"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-include", "force.h", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [
  { op = "delete-outputs" },
]

[[step]]
name = "edit-forced"
reuse = "miss"
action = [
  { op = "write", path = "force.h", content = "#define FORCED 2\n" },
  { op = "delete-outputs" },
]

[[step]]
name = "revert"
reuse = "hit"
action = [
  { op = "write", path = "force.h", content = "#define FORCED 1\n" },
  { op = "delete-outputs" },
]
