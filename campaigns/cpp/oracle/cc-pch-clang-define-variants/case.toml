summary = "a consumer's -include-pch path retargeted from one PCH to another built from the same header with another -D: the files it reads and their stamps are unchanged, so only the PCH bytes keep the entries apart (CCP-06)"
cohort = "blocking"
families = ["clang"]
profiles = ["transparent", "reproducible"]
outputs = ["a.pch", "b.pch", "u.o"]
ccache_config = { sloppiness = "pch_defines,time_macros" }

[[compile]]
argv = ["{cc}", "-DPCH_VALUE=1", "-x", "c-header", "pch.h", "-o", "a.pch"]
source = "pch.h"

[[compile]]
argv = ["{cc}", "-DPCH_VALUE=2", "-x", "c-header", "pch.h", "-o", "b.pch"]
source = "pch.h"

[[compile]]
argv = ["{cc}", "-include-pch", "p.pch", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"
action = [{ op = "symlink", path = "p.pch", target = "a.pch" }]

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "retarget"
reuse = "any"
action = [{ op = "delete-outputs" }, { op = "symlink", path = "p.pch", target = "b.pch" }]
