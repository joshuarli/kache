summary = "conditional PCH profile: with ccache sloppiness pch_defines,time_macros a clang -include-pch consumer is reused; a rebuilt PCH must invalidate (CCP-06)"
cohort = "open"
families = ["clang"]
profiles = ["transparent", "reproducible"]
outputs = ["pch.h.pch", "u.o"]
ccache_config = { sloppiness = "pch_defines,time_macros" }

[[compile]]
argv = ["{cc}", "-x", "c-header", "pch.h", "-o", "pch.h.pch"]
source = "pch.h"

[[compile]]
argv = ["{cc}", "-include-pch", "pch.h.pch", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "like-ccache"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit-header"
reuse = "miss"
action = [{ op = "write", path = "pch.h", content = "#define PCH_VALUE 2\n" }, { op = "delete-outputs" }]
