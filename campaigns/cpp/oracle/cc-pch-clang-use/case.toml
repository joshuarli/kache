summary = "a clang PCH and its -include-pch consumer are reused; a rebuilt PCH, an edited header and a header touched without edits (clang then rejects the PCH) all recompile (CCP-06)"
cohort = "blocking"
families = ["clang"]
profiles = ["transparent", "reproducible"]
outputs = ["pch.h.pch", "u.o"]
ccache_config = { sloppiness = "pch_defines,time_macros" }

[[compile]]
argv = ["{cc}", "-x", "c-header", "pch.h", "-o", "pch.h.pch"]
source = "pch.h"

[[compile]]
argv = ["{cc}", "-include-pch", "pch.h.pch", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit-header"
reuse = "miss"
action = [{ op = "write", path = "pch.h", content = "#define PCH_VALUE 2\n" }, { op = "delete-outputs" }]

[[step]]
name = "restore-edited"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "touch-header"
reuse = "miss"
action = [{ op = "touch", path = "pch.h" }, { op = "delete-outputs" }]
