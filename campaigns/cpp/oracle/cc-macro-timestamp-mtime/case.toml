summary = "probe __TIMESTAMP__ follows source mtime"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]
[[compile]]
argv = ["{cc}", "-c", "u.c", "-o", "u.o"]
source = "u.c"
[[step]]
name = "populate"
reuse = "miss"
[[step]]
name = "touch"
reuse = "any"
action = [{ op = "touch", path = "u.c" }, { op = "delete-outputs" }]
