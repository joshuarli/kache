summary = "GCC loads h.h.gch in place of a -include'd h.h: a .gch that appears, is swapped for another build or disappears changes the object, and dropping the .gch reuses the object built without it. GCC does not check a .gch against the header, so after h.h is edited GCC still compiles the older .gch, and only removing it shows the edit. GCC writes a different .gch on every build, so the steps that rebuild one do not require reuse (CCP-06)"
cohort = "blocking"
families = ["gcc"]
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]
unstable = ["built/h.h.gch", "built2/h.h.gch"]
ccache_config = { sloppiness = "pch_defines,time_macros" }

# Built from a copy of h.h, so editing h.h leaves an older usable .gch.
[[compile]]
argv = ["{cc}", "-g", "-O1", "-x", "c-header", "pchsrc/h.h", "-o", "built/h.h.gch"]
source = "pchsrc/h.h"
reuse = "any"

[[compile]]
argv = ["{cc}", "-g", "-O1", "-x", "c-header", "alt/h.h", "-o", "built2/h.h.gch"]
source = "alt/h.h"
reuse = "any"

[[compile]]
argv = ["{cc}", "-g", "-O1", "-include", "h.h", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "gch-appears"
reuse = "miss"
action = [{ op = "symlink", path = "h.h.gch", target = "built/h.h.gch" }]

[[step]]
name = "restore-with-gch"
reuse = "any"
action = [{ op = "delete-outputs" }]

[[step]]
name = "gch-other-build"
reuse = "miss"
action = [{ op = "symlink", path = "h.h.gch", target = "built2/h.h.gch" }]

[[step]]
name = "gch-removed"
reuse = "hit"
action = [{ op = "remove", path = "h.h.gch" }]

[[step]]
name = "gch-back"
reuse = "any"
action = [{ op = "symlink", path = "h.h.gch", target = "built/h.h.gch" }]

[[step]]
name = "edit-header-under-older-gch"
reuse = "any"
action = [{ op = "write", path = "h.h", content = "static inline int twice(int x) { return 3 * x; }\n" }]

[[step]]
name = "gch-removed-after-edit"
reuse = "miss"
action = [{ op = "remove", path = "h.h.gch" }]
