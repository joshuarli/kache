summary = "arm64+x86_64 universal objects (-arch twice) cache and restore every slice (CCP-07)"
cohort = "blocking"
families = ["clang"]
os = ["macos"]
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-arch", "arm64", "-arch", "x86_64", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit"
reuse = "miss"
action = [{ op = "write", path = "u.c", content = "int u(int x) { return x * 4; }\n" }, { op = "delete-outputs" }]
