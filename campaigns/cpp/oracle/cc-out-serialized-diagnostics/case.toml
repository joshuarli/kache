summary = "clang --serialize-diagnostics writes a .dia holding the warnings; a hit restores it with the object and replays the warning (CCP-05)"
cohort = "blocking"
families = ["clang"]
profiles = ["transparent", "reproducible"]
outputs = ["u.o", "diag/u.dia"]

[[compile]]
argv = ["{cc}", "-Wall", "--serialize-diagnostics", "diag/u.dia", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit"
reuse = "miss"
action = [{ op = "write", path = "u.c", content = "int u(int x) { int unused; return x * 9; }\n" }, { op = "delete-outputs" }]
