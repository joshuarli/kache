summary = "clang --serialize-diagnostics writes a .dia file; a hit must restore it (CCP-05)"
cohort = "open"
families = ["clang"]
profiles = ["transparent", "reproducible"]
outputs = ["u.o", "u.dia"]

[[compile]]
argv = ["{cc}", "--serialize-diagnostics", "u.dia", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "like-ccache"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit"
reuse = "miss"
action = [{ op = "write", path = "u.c", content = "int u(int x) { return x * 9; }\n" }, { op = "delete-outputs" }]
