summary = "a sanitizer ignorelist is keyed by its content: editing it changes instrumentation and must recompile; restoring it reuses"
cohort = "blocking"
families = ["clang"]
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-fsanitize=address", "-fsanitize-ignorelist=ign.txt", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "ignore-the-function"
reuse = "miss"
action = [{ op = "write", path = "ign.txt", content = "fun:u\n" }, { op = "delete-outputs" }]

[[step]]
name = "revert-ignorelist"
reuse = "hit"
action = [{ op = "write", path = "ign.txt", content = "fun:other\n" }, { op = "delete-outputs" }]
