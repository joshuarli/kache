summary = "an entry whose metadata is gone but whose blobs remain is a miss, never wrong output; the compile recovers and the repaired entry is reused"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o", "u.d"]

[[compile]]
argv = ["{cc}", "-MD", "-MF", "u.d", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "damaged-store"
reuse = "any"
action = [{ op = "kache-store-fault", fault = "delete-meta" }, { op = "delete-outputs" }]

[[step]]
name = "reuse-after-recovery"
reuse = "hit"
action = [{ op = "delete-outputs" }]
