summary = "a store whose entries were damaged (delete-blobs) never serves wrong output, recovers by compiling, and reuses the repaired entry"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "damaged-store"
reuse = "any"
action = [{ op = "kache-store-fault", fault = "delete-blobs" }, { op = "delete-outputs" }]

[[step]]
name = "reuse-after-recovery"
reuse = "hit"
action = [{ op = "delete-outputs" }]
