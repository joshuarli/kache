summary = "Chromium BUILDFLAG-style call-only paste indirection with a fixed prefix caches, and a header availability probe beside it still invalidates"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [
  { op = "delete-outputs" },
]

[[step]]
name = "probe-appears"
reuse = "miss"
action = [
  { op = "write", path = "opt.h", content = "#define OPT 7\n" },
  { op = "delete-outputs" },
]

[[step]]
name = "restore-present"
reuse = "hit"
action = [
  { op = "delete-outputs" },
]
