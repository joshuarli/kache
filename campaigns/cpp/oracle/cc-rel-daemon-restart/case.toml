summary = "entries survive a daemon restart before reuse, including one published just before the restart; the edit after them still misses"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restart-then-restore"
reuse = "hit"
action = [{ op = "restart-daemon" }, { op = "delete-outputs" }]

[[step]]
name = "edit"
reuse = "miss"
action = [{ op = "write", path = "h.h", content = "#define H 4\n" }, { op = "delete-outputs" }]

[[step]]
name = "restart-then-restore-edit"
reuse = "hit"
action = [{ op = "restart-daemon" }, { op = "delete-outputs" }]
