summary = "GCC -fharden-compares is keyed and cached"
cohort = "blocking"
families = ["gcc"]
profiles = ["transparent", "reproducible"]
outputs = ["plain.o", "hard.o"]

[[compile]]
argv = ["{cc}", "-O2", "-c", "u.c", "-o", "plain.o"]
source = "u.c"

[[compile]]
argv = ["{cc}", "-O2", "-fharden-compares", "-c", "u.c", "-o", "hard.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]
