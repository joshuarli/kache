summary = "--coverage writes a .gcno beside the object; a hit restores both, and an object naming another .gcda is never reused (CCP-05). GCC stamps the pair with the compile time; the oracle compares consistent pairs with the stamp zeroed"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["a/u.o", "a/u.gcno", "b/u.o", "b/u.gcno"]

[[compile]]
argv = ["{cc}", "--coverage", "-c", "u.c", "-o", "a/u.o"]
source = "u.c"

[[compile]]
argv = ["{cc}", "--coverage", "-c", "u.c", "-o", "b/u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "stale-notes"
reuse = "hit"
action = [{ op = "delete-outputs" }, { op = "write", path = "a/u.gcno", content = "stale\n" }]

[[step]]
name = "edit"
reuse = "miss"
action = [{ op = "write", path = "u.c", content = "int u(int x) { return x * 9; }\n" }, { op = "delete-outputs" }]
