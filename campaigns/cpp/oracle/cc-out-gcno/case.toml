summary = "--coverage writes a .gcno beside the object; a hit must restore both (CCP-05). GCC stamps .gcno and the object with the compile time, so GCC needs a stamp-aware comparator first"
cohort = "open"
families = ["clang"]
profiles = ["transparent", "reproducible"]
outputs = ["u.o", "u.gcno"]

[[compile]]
argv = ["{cc}", "--coverage", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "like-ccache"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit"
reuse = "miss"
action = [{ op = "write", path = "u.c", content = "int u(int x) { return x * 9; }\n" }, { op = "delete-outputs" }]
