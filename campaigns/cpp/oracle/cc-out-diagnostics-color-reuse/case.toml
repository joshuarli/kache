summary = "a unit with no diagnostics built with and without color reuses one entry for both settings, the colored build from the plain build's entry in the very first step: empty output reads the same under any formatting (CCP-05)"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["plain.o", "color.o"]

[[compile]]
argv = ["{cc}", "-Wall", "-c", "u.c", "-o", "plain.o"]
source = "u.c"

[[compile]]
argv = ["{cc}", "-Wall", "-fdiagnostics-color=always", "-c", "u.c", "-o", "color.o"]
source = "u.c"
reuse = "hit"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]
