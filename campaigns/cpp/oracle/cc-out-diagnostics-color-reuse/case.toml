summary = "a unit with warnings built with and without color reuses both: a colored entry replays without its escapes for a colorless build, and a colorless entry seen by a colored build is replaced (CCP-05)"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["plain.o", "color.o"]

[[compile]]
argv = ["{cc}", "-Wall", "-c", "u.c", "-o", "plain.o"]
source = "u.c"

[[compile]]
argv = ["{cc}", "-Wall", "-fdiagnostics-color=always", "-c", "u.c", "-o", "color.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]
