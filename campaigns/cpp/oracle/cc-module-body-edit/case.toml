summary = "editing a template body in an imported module, or a function in a module it imports, recompiles the -fmodule-file= consumer; restoring the edit reuses (CCP-06)"
cohort = "blocking"
families = ["clang"]
os = ["linux"]
profiles = ["transparent", "reproducible"]
outputs = ["N.pcm", "M.pcm", "use.o"]

[[compile]]
argv = ["{cxx}", "-std=c++20", "--precompile", "N.cppm", "-o", "N.pcm"]
source = "N.cppm"
uncached = true

[[compile]]
argv = ["{cxx}", "-std=c++20", "--precompile", "-fmodule-file=N=N.pcm", "M.cppm", "-o", "M.pcm"]
source = "M.cppm"
uncached = true

[[compile]]
argv = ["{cxx}", "-std=c++20", "-fmodule-file=M=M.pcm", "-fmodule-file=N=N.pcm", "-c", "use.cpp", "-o", "use.o"]
source = "use.cpp"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit-template-body"
reuse = "miss"
action = [{ op = "write", path = "M.cppm", content = "export module M;\nimport N;\nexport int seven() { return base() + 4; }\nexport template <class T> T twice(T x) { return x * 3; }\n" }]

[[step]]
name = "restore-edited"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit-transitive-module"
reuse = "miss"
action = [{ op = "write", path = "N.cppm", content = "export module N;\nexport int base() { return 30; }\n" }]
