summary = "with KACHE_VERIFY_RESTORES=always a bit-flipped blob is detected, the entry evicted and recompiled, and the repaired entry reused"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]
kache_env = { KACHE_VERIFY_RESTORES = "always" }

[[compile]]
argv = ["{cc}", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "damaged-store"
reuse = "any"
action = [{ op = "kache-store-fault", fault = "corrupt-blobs" }, { op = "delete-outputs" }]

[[step]]
name = "reuse-after-recovery"
reuse = "hit"
action = [{ op = "delete-outputs" }]
