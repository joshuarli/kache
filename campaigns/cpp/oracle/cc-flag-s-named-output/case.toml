summary = "named-file assembly output (-S -o) caches and restores like ccache"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["asm.s"]

[[compile]]
argv = ["{cc}", "-S", "asm.c", "-o", "asm.s"]
source = "asm.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "like-ccache"
action = [{ op = "delete-outputs" }]
