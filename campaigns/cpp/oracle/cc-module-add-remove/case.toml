summary = "module files added to, swapped in and removed from a -fprebuilt-module-path= directory: an entry swapped for another build of the same module misses with the directory listing unchanged, and returning to an earlier listing reuses (CCP-06)"
cohort = "blocking"
families = ["clang"]
os = ["linux"]
profiles = ["transparent", "reproducible"]
outputs = ["N.pcm", "M.pcm", "M2.pcm", "use.o"]

[[compile]]
argv = ["{cxx}", "-std=c++20", "--precompile", "N.cppm", "-o", "N.pcm"]
source = "N.cppm"
uncached = true

[[compile]]
argv = ["{cxx}", "-std=c++20", "--precompile", "-fmodule-file=N=N.pcm", "M.cppm", "-o", "M.pcm"]
source = "M.cppm"
uncached = true

[[compile]]
argv = ["{cxx}", "-std=c++20", "--precompile", "-fmodule-file=N=N.pcm", "M2.cppm", "-o", "M2.pcm"]
source = "M2.cppm"
uncached = true

[[compile]]
argv = ["{cxx}", "-std=c++20", "-fprebuilt-module-path=pre", "-c", "use.cpp", "-o", "use.o"]
source = "use.cpp"

[[step]]
name = "populate"
reuse = "miss"
action = [{ op = "symlink", path = "pre/N.pcm", target = "../N.pcm" }, { op = "symlink", path = "pre/M.pcm", target = "../M.pcm" }]

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "add-unimported-module"
reuse = "any"
action = [{ op = "symlink", path = "pre/Z.pcm", target = "../N.pcm" }]

[[step]]
name = "swap-module-build"
reuse = "miss"
action = [{ op = "symlink", path = "pre/M.pcm", target = "../M2.pcm" }]

[[step]]
name = "swap-back"
reuse = "hit"
action = [{ op = "delete-outputs" }, { op = "symlink", path = "pre/M.pcm", target = "../M.pcm" }]

[[step]]
name = "remove-unimported-module"
reuse = "hit"
action = [{ op = "remove", path = "pre/Z.pcm" }]
