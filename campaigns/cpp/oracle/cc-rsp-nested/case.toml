summary = "nested GNU response files expand from cwd and restore cached objects after deleting outputs"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "@outer.rsp"]
source = "u.c"
also_names = ["@outer.rsp"]

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit-inner"
reuse = "miss"
action = [{ op = "write", path = "inner.rsp", content = "-DNESTED=7\n" }, { op = "delete-outputs" }]

[[step]]
name = "restore-edit"
reuse = "hit"
action = [{ op = "delete-outputs" }]
