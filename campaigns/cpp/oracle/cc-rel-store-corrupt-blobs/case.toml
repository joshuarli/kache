summary = "a same-length bit flip in a stored blob must not be restored as a hit; kache defaults to KACHE_VERIFY_RESTORES=off and restores it (decision recorded in STATUS.md)"
cohort = "open"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "damaged-store"
reuse = "any"
action = [{ op = "kache-store-fault", fault = "corrupt-blobs" }, { op = "delete-outputs" }]

[[step]]
name = "reuse-after-recovery"
reuse = "hit"
action = [{ op = "delete-outputs" }]
