summary = "a Clang --config file named by path is keyed by its contents: an edit misses and a revert hits"
cohort = "blocking"
families = ["clang"]
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "--config=./extra.cfg", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit-config"
reuse = "miss"
action = [{ op = "write", path = "extra.cfg", content = "-DCFG=2\n" }, { op = "delete-outputs" }]

[[step]]
name = "revert-config"
reuse = "hit"
action = [{ op = "write", path = "extra.cfg", content = "-DCFG=1\n" }, { op = "delete-outputs" }]
