summary = "a clang --config file's contents are compile inputs"
cohort = "open"
families = ["clang"]
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "--config=./extra.cfg", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "like-ccache"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit-config"
reuse = "miss"
action = [{ op = "write", path = "extra.cfg", content = "-DCFG=2\n" }, { op = "delete-outputs" }]

[[step]]
name = "revert-config"
reuse = "like-ccache"
action = [{ op = "write", path = "extra.cfg", content = "-DCFG=1\n" }, { op = "delete-outputs" }]
