summary = "a GCC -specs file named by path is keyed by its contents: an edit misses and a revert hits"
cohort = "blocking"
families = ["gcc"]
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-specs=./extra.specs", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "edit-specs"
reuse = "miss"
action = [{ op = "write", path = "extra.specs", content = "*cpp_unique_options:\n+ -DSPEC=2\n" }, { op = "delete-outputs" }]

[[step]]
name = "revert-specs"
reuse = "hit"
action = [{ op = "write", path = "extra.specs", content = "*cpp_unique_options:\n+ -DSPEC=1\n" }, { op = "delete-outputs" }]
