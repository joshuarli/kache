summary = "under -g3 an added unused macro leaves the -E text unchanged but enters the object's macro debug info, so it must recompile"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-g3", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "restore"
reuse = "hit"
action = [{ op = "delete-outputs" }]

[[step]]
name = "add-unused-macro"
reuse = "any"
action = [{ op = "write", path = "h.h", content = "#define H 3\n#define UNUSED 9\n" }, { op = "delete-outputs" }]

[[step]]
name = "again"
reuse = "hit"
action = [{ op = "delete-outputs" }]
