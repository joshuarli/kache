summary = "an mtime-only change to a header reuses the entry"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "touch-header"
reuse = "hit"
action = [
  { op = "touch", path = "v.h" },
  { op = "delete-outputs" },
]

[[step]]
name = "touch-source"
reuse = "hit"
action = [
  { op = "touch", path = "u.c" },
  { op = "delete-outputs" },
]
