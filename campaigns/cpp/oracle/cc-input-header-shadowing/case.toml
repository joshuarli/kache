summary = "a same-named header appearing earlier in -I order shadows the old one; removing it restores"
cohort = "blocking"
profiles = ["transparent", "reproducible"]
outputs = ["u.o"]

[[compile]]
argv = ["{cc}", "-Iinc1", "-Iinc2", "-c", "u.c", "-o", "u.o"]
source = "u.c"

[[step]]
name = "populate"
reuse = "miss"

[[step]]
name = "shadow-appears"
reuse = "miss"
action = [
  { op = "write", path = "inc1/pick.h", content = "#define PICK 1\n" },
  { op = "delete-outputs" },
]

[[step]]
name = "shadow-removed"
reuse = "hit"
action = [
  { op = "remove", path = "inc1/pick.h" },
  { op = "delete-outputs" },
]
