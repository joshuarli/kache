# C/C++ parity campaign — initial in-scope case inventory (CCP-00).
#
# One entry per required behavior family/instance, mapped to kache's own
# case IDs. ccache's suites and unit tests are cited as provenance hints
# only; this file enumerates ORIGINAL kache cases — no upstream text is
# carried here. A "happy path" does not close a family; each entry states
# what would falsify it (via the transition set in C_CPP_PARITY_CAMPAIGN.md:
# empty → populate, delete-outputs → restore, semantic edit → miss, revert →
# reuse earlier, irrelevant edit → reuse, relocate/toolchain/policy switches).
#
# This is the CCP-00 BOOTSTRAP inventory. It covers every family the plan
# requires, but enumeration is not complete: CCP-01's runner and CCP-02..08
# work expand it. Completion criteria (every required behavior has a case or
# a documented disposition) live in the plan's final acceptance gate, not
# here. Status values:
#   planned        — will be executed; blocked by listed package
#   conditional    — requires the stated prerequisites; test the violations
#   out_of_scope   — disposition recorded; revisit only with a plan change
#   oracle         — executable: campaigns/cpp/oracle/<id>/ runs it through
#                    `make cc-oracle CASE=<id>`; its case.toml cohort says
#                    whether it blocks (`blocking`) or tracks a gap (`open`)
#
# profiles: transparent = KACHE_CC_PATH_NORMALIZE=0 + KACHE_CC_SOURCE_DATE_EPOCH=passthrough;
#           reproducible = documented kache default maps/epoch (raw and ccache
#           given identical effective flags); both = run in both profiles.
# compilers: all | gcc | clang | apple-clang | clang-cl

schema_version = 1
created = "2026-11-17"

[meta]
inventory_state = "initial (CCP-00 bootstrap); complete enumeration owed by CCP-01/CCP-02..CCP-08"
provenance_key = "ccache.suite = upstream suite filename at the pinned commit (reference only, not a kache dependency)"

