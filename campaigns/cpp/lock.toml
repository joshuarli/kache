# prereleases of laputa-systems/llvm-prebuilt-musl (musl-static
# LLVM/Clang 23.1.5); the Dockerfile downloads these exact assets and
# verifies the digests in its build.
repo = "https://github.com/laputa-systems/llvm-prebuilt-musl"
release_tag = "release-b29e4d07a2b9a5e72319b37429cf375149212755"
x86_64_asset = "clang+llvm-23.1.5-x86_64-linux-musl.tar.xz"
x86_64_sha256 = "de3f6d0ad089391482147c61648c511c500b25289132fe7f2c446a0905406d2a"
