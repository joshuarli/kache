# C/C++ parity campaign — lock file (CCP-00).
#
# Locks the reference toolchain, matrix hosts, project inputs, budgets and
# the performance estimator for the campaign described in
# C_CPP_PARITY_CAMPAIGN.md. Updating anything in this file requires an
# explicit baseline-change commit and a differential rerun of the affected
# evidence.
#
# Digests and versions recorded 2026-11-17.

schema_version = 1

[reference]
ccache_version = "4.14.3"
ccache_tag = "v4.14.3"
ccache_commit = "16464deae5188f8ef333cc693c58b63ee884e43e"
ccache_release_published = "2026-11-08T20:58:22Z"
ccache_repo = "https://github.com/ccache/ccache.git"
ccache_manual_url = "https://ccache.dev/manual/4.14.3.html"
ccache_source_url = "https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3.tar.xz"
ccache_source_sha256 = "e1999132cf7dbce48de7d946b767f3e26ea09adcb5daa4a7103a8fa09ee0637d"
ccache_pin_verified = "2026-11-17: git clone + rev-parse HEAD == pinned commit; tag v4.14.3 points at it"
# The upstream release ships a prebuilt darwin universal binary and static
# musl binaries. We lock those rather than building from source, so build
# options remain whatever upstream's release pipeline used; the binary
# digests are what the campaign verifies at fetch time. A source build is
# only needed for debugging ccache itself, never for campaign evidence.
ccache_binaries = [
  { lane = "M1", url = "https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-darwin.tar.gz", sha256 = "764dd2a8100ff83e6bbd7b9a1e2016cc401be34bee8a70ea99698186622c34d5", note = "universal x86_64+arm64; fetched and verified 2026-11-17; reports 4.14.3" },
  { lane = "L1", url = "https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-linux-x86_64-glibc.tar.gz", sha256 = "9ac91421d7372565118cb421e4dc2d03f273a11ab81ab9e051fd1cb4577222d7" },
  { lane = "L2", url = "https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-linux-aarch64-glibc.tar.gz", sha256 = "5af4c73f9a2c2ed27c17e48cf06868202738fecf8036cfbcdd7eb679930670cb" },
  { lane = "L3", url = "https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-linux-x86_64-musl-static.tar.gz", sha256 = "e4583fd653b794a480b9915358679a75cdd7a7010dd865eaf4cbdc61e665a3f0" },
  { lane = "L4", url = "https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-linux-aarch64-musl-static.tar.gz", sha256 = "4b0ecece7929cbaf548ff1ab9a24074b240132ab8176bc3865a27d88c457a0d8" },
]

[host_snapshot_m1]
# Recorded on the Apple Silicon host used for the 2026-11-17 baseline
# (Josh's workstation). This host qualifies as an M1 lane host for
# correctness work; see STATUS.md for the standalone-LLVM gap.
platform = "macOS 27.2.1 (26B131), Darwin 27.2.0"
xcode = "Xcode 27.0 (27A266a)"
apple_clang = "Apple clang 21.0.0 (clang-2100.3.34.2)"
clt_sdk = "MacOSX.sdk under /Library/Developer/CommandLineTools/SDKs (-target-sdk-version=27.2)"
xcode_sdk = "MacOSX27.0.sdk under /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
host_cc_digest_note = "/usr/bin/cc is the CommandLineTools shim (identical bytes for cc/clang++, sha256 ed6f5284033aa2aae6a58427c25ba3ab119947b40365627b24e5d51a4b70a1cd); e2e-cmake-ninja-flagset fails on this host only because of the gluon ninja shadow (see ninja_host_path_shadow)"
make = "GNU Make 3.81"
cmake = "4.4.2 (Homebrew)"
ninja = "1.13.2 (Homebrew, /opt/homebrew/bin/ninja)"
ninja_host_path_shadow = "~/.local/bin/ninja is a gluon-managed Mach-O that reports 1.13.2 but strips trailing variable whitespace, breaking CMAKE_CXX_COMPILER_LAUNCHER emission; e2e-cmake-ninja-flagset fails with it and passes with Homebrew ninja. CMake C/C++ fixture work on this host must use Homebrew ninja (PATH=/opt/homebrew/bin:$PATH)."
standalone_llvm = "NOT provisioned on this host (no /opt/homebrew/opt/llvm); M1 requires Apple Clang AND standalone LLVM Clang — see STATUS.md"

[matrix]
# Native execution is required for host correctness/performance claims.
# A container on a host of the same architecture counts as native;
# cross-compilation/emulation is additional evidence only.
# GitHub-hosted runner images and Homebrew/apt moving targets are not
# digest-pinnable; each CI run records the resolved tool versions in its
# logs, and an image/toolchain change is a baseline change.

[matrix.M1]
lane = "M1"
host = "xcode-27 GitHub runner, or any Apple Silicon Mac with Xcode 27"
reference_host = "this workstation, 2026-11-17 (see host_snapshot_m1)"
os = "macOS arm64"
compilers = ["Apple Clang 21.0.0 (Xcode 27.0)", "standalone LLVM Clang (version per CI job once provisioned; none on this host)"]
sdk = "MacOSX27.sdk family; CLT MacOSX.sdk also present on the reference host"
workloads = "full applicable corpus; SDK/frameworks; native and arm64+x86_64 universal objects"
status = "PARTIAL — Apple Clang verified locally; standalone LLVM Clang not provisioned anywhere yet; xcode-27 CI runner referenced by existing e2e-macos job"

[matrix.L1]
lane = "L1"
host = "ubuntu-26.04 GitHub runner"
os = "Linux x86_64, glibc"
compilers = ["GCC (distro, apt)", "Clang (distro, apt)"]
workloads = "full applicable corpus and real-build integration"
status = "ASSIGNED — e2e-linux-glibc CI job added by this groundwork; runs make e2e + make e2e-negative-control with --deny-missing-tools (fixture tools installed via apt)"

[matrix.L2]
lane = "L2"
host = "ubuntu-26.04-arm GitHub runner"
os = "Linux aarch64, glibc"
compilers = ["GCC (distro, apt)", "Clang (distro, apt)"]
workloads = "full applicable corpus and real-build integration"
status = "ASSIGNED — e2e-linux-glibc CI job added by this groundwork; runs make e2e + make e2e-negative-control with --deny-missing-tools (fixture tools installed via apt)"

[matrix.L3]
lane = "L3"
host = "Alpine container on ubuntu-26.04, or any x86_64 Alpine host"
os = "Alpine 3.24.2 (musl libc), x86_64"
compilers = ["prebuilt LLVM Clang 23.1.5 (laputa-systems/llvm-prebuilt-musl prerelease release-b29e4d07a2b9a5e72319b37429cf375149212755, musl-linked, in-image)", "GCC/G++ 15.2.0-r5 (apk, added by this groundwork)"]
image = "Dockerfile, FROM alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
workloads = "native kache/engine execution, deterministic core, fixtures, release/runtime checks"
status = "ASSIGNED — linux-musl CI job now runs make e2e + make e2e-negative-control in image; local docker daemon (OrbStack) not running, Linux lanes verified via CI only"

[matrix.L4]
lane = "L4"
host = "Alpine container on ubuntu-26.04-arm, or any aarch64 Alpine host"
os = "Alpine 3.24.2 (musl libc), aarch64"
compilers = ["prebuilt LLVM Clang 23.1.5 (laputa-systems/llvm-prebuilt-musl prerelease release-b29e4d07a2b9a5e72319b37429cf375149212755, musl-linked, in-image)", "GCC/G++ 15.2.0-r5 (apk, added by this groundwork)"]
image = "Dockerfile, FROM alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
workloads = "same contract as L3"
status = "ASSIGNED — linux-musl CI job now runs make e2e + make e2e-negative-control in image; local docker daemon (OrbStack) not running, Linux lanes verified via CI only"

[matrix.intel_macos]
lane = "not required"
status = "OUT OF SCOPE — intel macOS is not a kache release target; add only with an x86_64-apple-darwin release and a native runner"

[llvm_prebuilt_musl]
