[projects]
# Pinned project inputs for CCP-07 real-build integration. The campaign's
# fixture (small cc-crate mixed Rust/C/C++ project) is created in CCP-07
# and pinned there.

[projects.zlib]
repo = "https://github.com/madler/zlib"
ref = "v1.3.2"
url = "https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz"
sha256 = "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"
purpose = "small C build; autotools-style and direct builds"
verified = "2026-11-17: downloaded; sha256 matches the release asset digest"

[projects.llvm]
repo = "https://github.com/llvm/llvm-project"
ref = "llvmorg-21.1.8"
purpose = "fixed LLVM/Clang target subset (C++); reuses scenarios/bench-llvm's pin and build shape (X86 target, Release, assertions off)"
note = "bump only with an explicit baseline-change commit"

[projects.chromium]
version = "157.0.8103.80"
stability = "Chrome stable 2026-11"
source_url = "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-157.0.8103.80.tar.xz"
# The archive is ~1.6 GB; its SHA-256 is recorded here at first fetch in
# CCP-07 (download once, verify, commit the digest). Until then the pin is
# the URL + version + the Chromium source tag of the same version.
source_sha256 = "RECORD-AT-FETCH (CCP-07)"
targets = ["//base", "one Blink target (selected and frozen in CCP-07)"]
gn_args = [
  'target_os = "mac"',
  'target_cpu = "arm64"',
  'is_official_build = true',
  'use_lld = true',
  'use_thin_lto = true',
  'chrome_pgo_phase = 2',
]
gn_notes = "chrome_pgo_phase=2 consumes the pinned mac-arm PGO profile that the build fetches itself; freeze the profile digest at first fetch (CCP-07). Built through cc_wrapper. Frozen args and targets must not be widened without a baseline-change commit."
purpose = "large official macOS arm64 C++/C build pinned for the M1 lane"

[budgets]
exploration_primary_lanes = ["M1", "L1"]
exploration_seeded_sequences_per_lane = 200
exploration_max_minutes_per_lane_per_revision = 30
exploration_minimize_cap_minutes = 10
per_case_timeout_seconds = 600
per_transition_sequence_max_cases = 200
parallel_jobs = "at most half the lane cores, at least 1; CI runners are unmetered so jobs may saturate them, but timed comparisons never share a host with unrelated heavy work"
case_scratch_ceiling_gb = 2
campaign_scratch_ceiling_gb = 20
log_artifact_retention = "CI artifacts + campaign scratch; ledger records IDs/digests; scratch evidence is provisional until the report is committed"

[perf_estimator]
# Locked before implementation measurements exist. Thresholds are from the
# plan; changing them requires a justified plan-change commit.
paired_arms = ["kache", "ccache", "raw"]
min_valid_pairs = 5
max_valid_pairs = 10
pair_escalation_rule = "increase from 5 to at most 10 only to resolve a concrete uncertainty"
seed = 20261117
order = "randomized interleaved invocation order per pair, seeded with `seed`"
estimator = "paired per-pair ratios kache/ccache (and kache/raw where the plan says raw); report the geomean ratio per workload plus per-pair spread"
uncertainty = "two-sided 95% t-interval on the paired ratios (df = n - 1)"
admission = "a run is admitted only if (a) the untimed instrumented replay validated compiler activity/reuse for the same commands, (b) input/configuration digests match the timed run, (c) instrumentation was disabled for timing, (d) cache counters retained. Workload mismatch invalidates the sample."
sample_retention = "retain all admitted samples; exclude only documented preparation/measurement failures, ruled identically for all arms"
reporting = "wall, CPU, peak memory, cache/artifact bytes, compiler executions, time-weighted reuse; per named project/corpus and per primary lane, not just a global average; tiny single units additionally in absolute milliseconds"
verdict_rule = { pass = "95% CI upper bound <= target", fail = "95% CI lower bound > target", inconclusive = "interval crosses the target at the sample cap" }
host_load = "recorded with every performance result; never time on a host running unrelated heavy work"

[perf_targets]
# Blocking engineering targets, frozen before implementation measurements.
# Per named project/corpus and primary performance lane (M1, L1, L2), not
# a pooled average.
warm_same_tree_ratio = 1.15
warm_relocated_ratio_reproducible_profile = 1.15
cold_ratio = 1.10
cold_build_vs_raw_ratio = 1.15
edit_revert_and_equivalent_preprocessing_ratio = 1.15
required_safe_hit_cases = "correct complete restoration and independently verified avoided code generation"

[gates]
frequent = ["M1 (Apple Clang)", "L1 (GCC, Clang)", "affected critical key/restore cases in other lanes"]
full_matrix = "scheduled/manual jobs and final acceptance cover M1, L1, L2, L3, L4"
kache21_arch_note = "every gate fixture now runs on macOS arm64 (e2e-macos), Linux x86_64/aarch64 glibc (e2e-linux-glibc), and Linux x86_64/aarch64 musl (linux-musl image); e2e-cc-cross-gcc is glibc-only by declaration (os = [\"glibc\"])"
