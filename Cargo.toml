[package]
name = "kache"
default-run = "kache"
autobins = false
version = "2.0.0-rc.2"
edition = "2024"
description = "Compiler cache for Rust and C/C++."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"
keywords = ["build-cache", "rustc-wrapper", "blake3", "cargo"]
categories = ["development-tools::build-utils", "caching"]
rust-version = "1.95"

[lib]
path = "src/main.rs"

[[bin]]
name = "kache"
path = "src/frontend.rs"

[[bin]]
name = "kache-engine"
path = "src/engine.rs"

[features]
default = []

[workspace]
members = [
    "crates/kache-core",
    "crates/kache-config",
    "crates/kache-client",
    "crates/kache-protocol",
    "crates/kache-ipc",
    "crates/kache-format",
    "crates/kache-fs",
    "crates/kache-shims",
    "crates/kache-store",
    "crates/kache-e2e",
    "crates/kache-proofs",
]
# scenarios/e2e-*/source and test-projects/* are not listed: each declares its own empty
# `[workspace]` so cargo treats them as standalone, which is what the
# e2e harness (and the integration tests) need to drive them as
# realistic standalone consumers of kache.
#
# `tmp/` is the bench and e2e scratch tree, where third-party subjects are
# cloned. A subject that is itself a workspace root (substrate, opendal) stops
# cargo's upward walk on its own, but a plain single-package subject (jdx/hk)
# does not, and cargo then refuses to build it: "current package believes it's
# in a workspace when it's not". We do not control those manifests, so exclude
# the directory they land in.
exclude = ["tmp"]
resolver = "3"

[dependencies]
kache-client = { version = "2.0.0-rc.2", path = "crates/kache-client" }
kache-config = { version = "2.0.0-rc.2", path = "crates/kache-config" }
kache-protocol = { version = "2.0.0-rc.2", path = "crates/kache-protocol" }
kache-ipc = { version = "2.0.0-rc.2", path = "crates/kache-ipc" }
foldhash = "0.2"
kunobi-daemon = { version = "0.10.3", default-features = false, features = ["wire", "local", "launch"] }
kache-format = { version = "2.0.0-rc.2", path = "crates/kache-format" }
kache-fs = { version = "2.0.0-rc.2", path = "crates/kache-fs" }
kache-store = { version = "2.0.0-rc.2", path = "crates/kache-store" }
kache-shims = { version = "2.0.0-rc.2", path = "crates/kache-shims" }
blake3 = "1"
bytes = "1"
kache-core = { version = "2.0.0-rc.2", path = "crates/kache-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "1"
toml_edit = "0.25"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"
filetime = "0.2"
anyhow = "1"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
zstd = "0.14"
bytesize = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
home = "0.5.12"
tar = "0.4"
getrandom = "0.4"
glob = "0.3"
libc = "0.2"
# `#[mutants::skip]` is a no-op. cargo-mutants reads it so a body the Linux
# lane never runs (the Win32 volume query, the macOS permit wait) is not
# scored as a survivor.
mutants = "0.0.4"
memchr = "2"
tempfile = "3"
interprocess = "2.4.7"
# Unicode tables affect persisted cache-key bytes. Keep Unicode 17 until
# normalization changes have a reviewed cache-key compatibility migration.
unicode-normalization = "=0.1.25"
# Used by `src/compiler/flags.rs` (the cc / future Swift / future MSVC
# flag classifier). The `regex` crate is linear-time by construction
# (no backtracking, no lookarounds) — matters because the wrapper runs
# the classifier on every cc compile argument; bounded cost is a design
# requirement.
regex = { version = "1", default-features = false, features = ["std", "perf"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm"] }

[dev-dependencies]
kache-config = { version = "2.0.0-rc.2", path = "crates/kache-config", features = ["test-support"] }
kache-protocol = { version = "2.0.0-rc.2", path = "crates/kache-protocol", features = ["test-support"] }
kache-store = { version = "2.0.0-rc.2", path = "crates/kache-store", features = ["test-support"] }
kache-fs = { version = "2.0.0-rc.2", path = "crates/kache-fs", features = ["testing"] }
assert_cmd = "2"
predicates = "3"
proptest = { version = "1.12.0", default-features = false, features = ["std", "handle-panics"] }
serde_json = "1"
bytes = "1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

# Debian packaging (cargo-deb). Read by the _workflows build_deb step to
# produce kache_<version>_{amd64,arm64}.deb, which package-publish.yml then
# pushes into the apt repo on R2. cargo-deb reads this regardless of the
# --target passed, so the same config drives both amd64 and arm64 builds.
[package.metadata.deb]
maintainer = "Kunobi Ninja <feedback@kunobi.ninja>"
copyright = "2026, Zondax AG"
license-file = ["LICENSE", "0"]
extended-description = """\
kache is a zero-copy, content-addressed build cache for Rust, C/C++ and more. \
It avoids file \
copies and wasted disk by hardlinking artifacts locally and sharing them \
via S3-compatible object storage or a shared filesystem."""
section = "utils"
priority = "optional"
# CRITICAL: empty depends. kache is built as a static musl binary, so it has
# no shared-library runtime dependencies. An auto-resolved or non-empty
# `depends` would pin glibc and break install on musl/minimal systems.
depends = ""
assets = [
    ["target/release/kache", "usr/bin/kache", "755"],
    ["target/release/kache-engine", "usr/bin/kache-engine", "755"],
    ["README.md", "usr/share/doc/kache/README", "644"],
]
# postinst runs `kache init --shims /usr/lib/kache --force --canonical-only`
# so the farm matches SHIM_NAMES in this binary. prerm removes those links.
maintainer-scripts = "packaging/debian/"

[profile.dev]
debug = 0
strip = "symbols"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[lints.rust]
warnings = "deny"

[lints.clippy]
permissions_set_readonly_false = "allow"
too_many_arguments = "allow"
