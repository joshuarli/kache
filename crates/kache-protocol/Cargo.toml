[package]
name = "kache-protocol"
version = "2.0.0-rc.2"
edition = "2024"
rust-version = "1.95"
description = "Shared data types for Kache's local client and daemon protocol."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"

[features]
test-support = []

[dependencies]
kache-format = { version = "2.0.0-rc.2", path = "../kache-format" }
kache-core = { version = "2.0.0-rc.2", path = "../kache-core" }
deser = { version = "0.10.2", features = ["derive"] }

[dev-dependencies]
deser-json = "0.10.2"
deser-value = "0.10.2"

[lints.rust]
warnings = "deny"
