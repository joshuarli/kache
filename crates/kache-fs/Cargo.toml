[package]
name = "kache-fs"
version = "2.0.0-rc.2"
edition = "2024"
rust-version = "1.95"
description = "Filesystem measurements, file identity, native cloning and copying."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"
documentation = "https://docs.rs/kache-fs"
keywords = ["reflink", "filesystem", "hardlink", "disk-usage", "fiemap"]
categories = ["filesystem", "development-tools::build-utils"]

[dependencies]
libc = "0.2"
deser = { version = "0.10.2", features = ["derive"], optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
deser-json = "0.10.2"
deser-value = "0.10.2"

[features]
default = []
deser = ["dep:deser"]
staging = ["dep:tempfile"]
testing = ["dep:tempfile"]

[lints.rust]
warnings = "deny"
