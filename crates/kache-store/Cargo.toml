[package]
name = "kache-store"
version = "2.0.0-rc.2"
edition = "2024"
rust-version = "1.95"
description = "Local content-addressed artifact storage for kache."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"
documentation = "https://docs.rs/kache-store"
keywords = ["build-cache", "content-addressed", "cache", "storage", "compiler-cache"]
categories = ["caching", "development-tools::build-utils"]

[features]
test-support = []

[[example]]
name = "bench-cc-memos"
required-features = ["test-support"]

[dependencies]
kache-core = { version = "2.0.0-rc.2", path = "../kache-core" }
kache-format = { version = "2.0.0-rc.2", path = "../kache-format" }
kache-fs = { version = "2.0.0-rc.2", path = "../kache-fs", features = ["staging"] }
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
libc = "0.2"
tracing = "0.1"
tempfile = "3"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
serde_json = "1"

# Preserve the lint settings of the binary these modules came from.
[lints.clippy]
permissions_set_readonly_false = "allow"
too_many_arguments = "allow"
