[package]
name = "kache-e2e"
version = "2.0.0-rc.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
rust-version = "1.95"
publish = false
description = "End-to-end test harness for kache: drives example projects through cold/warm/noop and asserts against kache's own JSON report."
autobins = false

[[bin]]
name = "kache-scenario"
path = "src/bin/kache-scenario.rs"

[[bin]]
name = "e2e-fallback"
path = "src/bin/e2e-fallback.rs"

[[bin]]
name = "kache-cc"
path = "src/bin/kache-cc.rs"

[[bin]]
name = "kache-cxx"
path = "src/bin/kache-cxx.rs"

[dependencies]
anyhow = "1"
kache-core = { version = "2.0.0-rc.2", path = "../kache-core" }
indexmap = "2"
lexopt = "0.3"
deser = { version = "0.10.2", features = ["derive", "indexmap"] }
deser-json = "0.10.2"
deser-value = "0.10.2"
tempfile = "3"
deser-toml = "0.10.2"

[lints.rust]
warnings = "deny"

[dev-dependencies]
kache-fs = { version = "2.0.0-rc.2", path = "../kache-fs", features = ["testing"] }
