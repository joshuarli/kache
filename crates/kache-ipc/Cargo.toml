[package]
name = "kache-ipc"
version = "2.0.0-rc.2"
edition = "2024"
rust-version = "1.95"
description = "Local sockets, endpoint naming, and peer checks for Kache."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"

[features]
default = []
async = ["dep:async-net", "dep:futures-lite"]

[dependencies]
kache-protocol = { version = "2.0.0-rc.2", path = "../kache-protocol" }
kache-fs = { version = "2.0.0-rc.2", path = "../kache-fs", features = ["staging"] }
serde = "1"
serde_json = "1"
tracing = "0.1"
anyhow = "1"
interprocess = "2.4.7"
kunobi-daemon = { version = "0.10.3", default-features = false, features = ["local"] }
async-net = { version = "2", optional = true }
futures-lite = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
smol = "2"
async-net = "2"
futures-lite = "2"

[lints.rust]
warnings = "deny"
