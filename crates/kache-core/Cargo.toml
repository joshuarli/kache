[package]
name = "kache-core"
version = "2.0.0-rc.2"
edition = "2024"
description = "Shared store options and build-timeline records for kache."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"
documentation = "https://docs.rs/kache-core"
rust-version = "1.93"
keywords = ["build-cache", "cache"]
categories = ["development-tools::build-utils", "caching"]

[dependencies]
deser = { version = "0.10.2", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
deser-json = "0.10.2"
deser-value = "0.10.2"
