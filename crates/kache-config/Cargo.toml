[package]
name = "kache-config"
version = "2.0.0-rc.2"
edition = "2024"
rust-version = "1.95"
description = "Invocation inputs and shared configuration for Kache."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"

[features]
test-support = ["kache-fs/testing", "file-write"]
file-write = ["dep:toml_edit"]

[dependencies]
kache-core = { version = "2.0.0-rc.2", path = "../kache-core" }
kache-fs = { version = "2.0.0-rc.2", path = "../kache-fs" }
kache-shims = { version = "2.0.0-rc.2", path = "../kache-shims" }
anyhow = "1"
blake3 = "1"
dirs = "7"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = { version = "0.25", optional = true }
log = "0.4"

[dev-dependencies]
kache-fs = { version = "2.0.0-rc.2", path = "../kache-fs", features = ["testing"] }
kache-log = { version = "2.0.0-rc.2", path = "../kache-log" }
tempfile = "3"
