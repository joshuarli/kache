[package]
name = "kache-client"
version = "2.0.0-rc.2"
edition = "2024"
rust-version = "1.95"
description = "Synchronous compiler client for the Kache daemon."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"

[dependencies]
kache-config = { version = "2.0.0-rc.2", path = "../kache-config" }
kache-ipc = { version = "2.0.0-rc.2", path = "../kache-ipc" }
kache-protocol = { version = "2.0.0-rc.2", path = "../kache-protocol" }
anyhow = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
libc = "0.2"

kache-shims = { version = "2.0.0-rc.2", path = "../kache-shims" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[build-dependencies]
syn = { version = "3", default-features = false, features = ["derive", "parsing"] }
heck = "0.5"
