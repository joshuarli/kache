# Two cached objects plus a link. Links always pass through, so a warm
# rebuild restores both objects and relinks them; the linked program must
# match the cold build byte for byte.

name = "e2e-cc-link"
tags = ["suite:e2e", "lang:cc"]
os = ["linux", "macos"]

[source]
kind = "fixture"
path = "source"

[env]
CC = "$KACHE cc"

[commands]
build = "make"
clean = "make clean"

[verify]
run = "./build/prog"
expected_stdout_contains = ["sum=3"]

[diff]
artifacts = ["build/a.o", "build/b.o", "build/prog"]

[modify]
file = "src/a.c"
find = "return 1;"
replace = "return 2;"

[assertions.cold]
min_entries_after = 2
max_entries_after = 2

[assertions.warm]
min_hits = 2
max_misses = 0

[assertions.noop]
should_not_recompile = false

[assertions.relocate]
min_hits = 2
max_misses = 0

[assertions.relocate-modified]
min_misses = 1
max_misses = 1
