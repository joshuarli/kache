# kache-e2e fixture: a response-file compile kache expands and caches.
#
# The compile is `cc @args.rsp`: the real flags (`-O2 -c src/main.c -o
# build/main.o`) live inside the response file. The GNU driver path expands
# the file before parsing (src/compiler/cc.rs, `cc_args_with_response_files`),
# so the invocation is keyed and cached like the same flags given directly.
# Response files GCC and Clang read differently still pass through; the
# differential oracle covers those (campaigns/cpp/oracle/cc-rsp-*).

name = "e2e-cc-response-file"
tags = ["suite:e2e", "lang:cc"]

[source]
kind = "fixture"
path = "source"

[env]
CC = "$KACHE cc"

[commands]
build = "make"
clean = "make clean"

[verify]
run = "./build/main"
expected_stdout_contains = ["response-file ok"]

# Cold: the expanded compile misses and is stored.
[assertions.cold]
min_entries_after = 1
max_compiler_runs = 1

# Warm: clean wipes build/, the rebuild restores without compiling.
[assertions.warm]
min_hits = 1
max_compiler_runs = 0

# Noop: `make` sees the binary up to date and does nothing.
[assertions.noop]
should_not_recompile = false
