name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  macos:
    name: test (macOS)
    runs-on: xcode-27
    if: vars.KACHE_MACOS_CI != 'off'
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-26
      - name: Test
        run: make test

  e2e-macos:
    name: e2e (macOS)
    runs-on: xcode-27
    if: vars.KACHE_MACOS_CI != 'off'
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-26-e2e
      - uses: laputa-systems/buildlib/setup@1cd9d482a684e72c68ac6fea7f4ee3a3e9c4a161 # v0.3.1
        with:
          tools: gluon
          lock: .github/tools.lock.json
      - name: Install fixture tools
        run: |
          # cmake-build publishes Linux musl assets only.
          for tool in cmake; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
      - name: Fixture scenarios
        run: make e2e
      - name: Fixture scenarios with the cache disabled
        run: make e2e-negative-control
      - name: C/C++ differential oracle
        run: make cc-oracle
      - name: Upload oracle reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc-oracle-macos-${{ github.run_id }}
          path: .work/tmp/cc-oracle/*/report.*
          include-hidden-files: true
          if-no-files-found: warn

  cc-oracle-negative-macos:
    name: cc-oracle negative control (macOS, ${{ matrix.control }})
    runs-on: xcode-27
    if: vars.KACHE_MACOS_CI != 'off'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        control: [stale-output, omit-sidecar, disabled-invalidation, cache-disabled, reference-failure, wrong-effective-args]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cc-oracle-negative-macos
      - name: C/C++ oracle negative control
        run: make cc-oracle-negative-control CC_ORACLE_CONTROLS=${{ matrix.control }}
      - name: Upload oracle reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc-oracle-negative-macos-${{ matrix.control }}-${{ github.run_id }}
          path: .work/tmp/cc-oracle/*/report.*
          include-hidden-files: true
          if-no-files-found: warn

  linux-musl:
    name: test (Linux ${{ matrix.arch }} musl)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - arch: ARM64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Linux image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: kache-builder:${{ matrix.target }}
          cache-from: type=gha,scope=kache-${{ matrix.target }}
      - name: test in image
        run: |
          docker run --rm --init \
            --platform "${{ matrix.platform }}" \
            -e CI \
            -v "$GITHUB_WORKSPACE:/kache" \
            -w /kache \
            kache-builder:${{ matrix.target }} \
            sh -ec '
              make test TARGET=${{ matrix.target }}
            '
      - name: C/C++ differential oracle in image
        run: |
          docker run --rm --init \
            --platform "${{ matrix.platform }}" \
            -e CI \
            -v "$GITHUB_WORKSPACE:/kache" \
            -w /kache \
            kache-builder:${{ matrix.target }} \
            sh -ec '
              make cc-oracle cc-oracle-negative-control TOOLCHAINS="gcc clang"
            '
      - name: Upload oracle reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc-oracle-musl-${{ matrix.arch }}-${{ github.run_id }}
          path: .work/tmp/cc-oracle/*/report.*
          include-hidden-files: true
          if-no-files-found: warn
      - name: e2e in image
        run: |
          docker run --rm --init \
            --platform "${{ matrix.platform }}" \
            -e CI \
            -e TMPDIR=/kache/tmp \
            -e KACHE_E2E_SKIP_HARDLINK_CHECK=1 \
            -v "$GITHUB_WORKSPACE:/kache" \
            -w /kache \
            kache-builder:${{ matrix.target }} \
            sh -ec '
              mkdir -p /kache/tmp && make e2e && make e2e-negative-control
            '
      - name: Upload fixture results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-musl-${{ matrix.arch }}-${{ github.run_id }}
          path: tmp/e2e/
          if-no-files-found: warn

  cc-oracle-linux-glibc:
    name: cc-oracle (Linux ${{ matrix.arch }} glibc)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: ARM64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cc-oracle-linux-glibc-${{ matrix.arch }}
      - name: Install compilers
        run: |
          sudo apt-get update
          # llvm-prebuilt-musl publishes Linux musl assets; this job runs on glibc.
          sudo apt-get install -y --no-install-recommends build-essential clang
      - name: C/C++ differential oracle
        run: make cc-oracle TOOLCHAINS="gcc clang"
      - name: C/C++ oracle negative controls
        run: make cc-oracle-negative-control TOOLCHAINS="gcc clang"
      - name: Upload oracle reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc-oracle-glibc-${{ matrix.arch }}-${{ github.run_id }}
          path: .work/tmp/cc-oracle/*/report.*
          include-hidden-files: true
          if-no-files-found: warn

  e2e-linux-glibc:
    name: e2e (Linux ${{ matrix.arch }} glibc)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: ARM64
            runner: ubuntu-26.04-arm
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: e2e-linux-glibc-${{ matrix.arch }}
      - name: Install fixture tools
        run: |
          sudo apt-get update
          # cmake-build and gluon publish Linux musl assets; this job runs on glibc.
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            gcc-riscv64-linux-gnu \
            gcc-arm-linux-gnueabihf
      - name: Prepare shared-filesystem scratch
        run: mkdir -p "$GITHUB_WORKSPACE/tmp"
      - name: Fixture scenarios
        run: make e2e
        env:
          TMPDIR: ${{ github.workspace }}/tmp
          # The fixture contracts on the restore hardlinking the rlib into
          # the target; this substrate clones instead, so the carrier never
          # exists. The fixture documents this escape hatch for such hosts.
          KACHE_E2E_SKIP_HARDLINK_CHECK: "1"
      - name: Fixture scenarios with the cache disabled
        run: make e2e-negative-control
        env:
          TMPDIR: ${{ github.workspace }}/tmp
      - name: Upload fixture results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-glibc-${{ matrix.arch }}-${{ github.run_id }}
          path: tmp/e2e/
          if-no-files-found: warn
