name: cc-oracle-full

# The whole C/C++ oracle corpus, open cases included, so unfinished cases
# stay visible without gating pull requests. The run passes when every case
# ran; the report says which ones match.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  macos:
    name: cc-oracle-full (macOS)
    runs-on: xcode-27
    if: vars.KACHE_MACOS_CI != 'off'
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cc-oracle-full-macos
      - name: Full oracle corpus
        run: make cc-oracle-full || true
      - name: Summary
        if: always()
        run: cat .work/tmp/cc-oracle/*/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report was written" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc-oracle-full-macos-${{ github.run_id }}
          path: .work/tmp/cc-oracle/*/report.*
          include-hidden-files: true
          if-no-files-found: error

  linux-glibc:
    name: cc-oracle-full (Linux ${{ matrix.arch }} glibc)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: ARM64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cc-oracle-full-linux-glibc-${{ matrix.arch }}
      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang
      - name: Full oracle corpus
        run: make cc-oracle-full TOOLCHAINS="gcc clang" || true
      - name: Summary
        if: always()
        run: cat .work/tmp/cc-oracle/*/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report was written" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc-oracle-full-glibc-${{ matrix.arch }}-${{ github.run_id }}
          path: .work/tmp/cc-oracle/*/report.*
          include-hidden-files: true
          if-no-files-found: error
